name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: autocar_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Run migrations
        id: migrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p storage/logs
          php artisan migrate --force 2>&1 | tee storage/logs/ci-migrate.log
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: autocar_test
          DB_USERNAME: root
          DB_PASSWORD: root
      - name: Run Pint
        id: pint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/pint --test 2>&1 | tee storage/logs/ci-pint.log
      - name: Run PHPStan
        id: phpstan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress 2>&1 | tee storage/logs/ci-phpstan.log
      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee storage/logs/ci-tests.log
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: autocar_test
          DB_USERNAME: root
          DB_PASSWORD: root
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-diagnostics
          path: storage/logs/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce quality result
        if: always()
        shell: bash
        run: |
          test "${{ steps.migrate.outcome }}" = success
          test "${{ steps.pint.outcome }}" = success
          test "${{ steps.phpstan.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
