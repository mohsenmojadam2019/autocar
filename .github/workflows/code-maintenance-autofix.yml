name: code-maintenance-autofix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Ensure Pest toolchain
        shell: bash
        run: |
          if ! composer show pestphp/pest >/dev/null 2>&1; then
            composer require --dev pestphp/pest:^4.0 pestphp/pest-plugin-laravel:^4.0 --no-interaction --with-all-dependencies
          fi
      - name: Format PHP
        run: vendor/bin/pint
      - name: Commit maintenance changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock app bootstrap config database routes tests .github || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format code and ensure Pest toolchain"
          git push origin HEAD:main
